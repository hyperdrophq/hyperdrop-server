<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
{{template "favicon"}}
<title>Password required — HyperDrop</title>
{{.OG}}
<style>
 body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;max-width:420px;margin:12vh auto;padding:0 1.2rem;color:#1D1D1F;background:#fff}
 @media(prefers-color-scheme:dark){body{color:#F2F2F7;background:#161618}}
 h1{font-size:1.2rem} .err{color:#d33;font-size:.9rem}
 input{width:100%;padding:.6rem;font-size:1rem;margin:.5rem 0;border:1px solid #ccc;border-radius:8px}
 button{padding:.55rem 1.1rem;font-weight:600;color:#fff;border:0;border-radius:8px;cursor:pointer;
        background:#1D1D1F}
 @media(prefers-color-scheme:dark){button{color:#1D1D1F;background:#E8E8ED}}
 .keep{display:flex;align-items:center;gap:.5rem;margin:.4rem 0 0;font-size:.95rem}
 .keep input{width:auto;margin:0;padding:0}
 .hint{color:#86868B;font-size:.8rem;margin:.25rem 0 .9rem}
</style></head><body>
<h1>This share is password-protected</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}">
 <input type="password" name="password" placeholder="Password" autofocus required>
 <input type="hidden" name="next" value="{{.Next}}">
 <label class="keep"><input type="checkbox" name="keep" value="1">This is my computer</label>
 <p class="hint">Stay unlocked on this browser. Leave this unticked on a shared computer.</p>
 <button type="submit">Unlock</button>
</form>
</body></html>
