<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{template "favicon"}}
<title>Download link expired — HyperDrop</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: light dark;
    {{template "brandTokens"}}
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F2F2F7; --paper: #161618; --hairline: #3A3A3C; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    max-width: 560px; margin: 0 auto; padding: 4rem 1.2rem 1rem;
    color: var(--ink); background: var(--paper); text-align: center;
  }
  h1 { font-size: 1.25rem; margin: 1.2rem 0 .3rem; letter-spacing: -.01em; }
  .note { color: var(--muted); font-size: .95rem; line-height: 1.5; margin: 0 auto 1.6rem; max-width: 26rem; }
  .back { display: inline-block; padding: .7rem 1.4rem; border-radius: 999px;
          background: var(--indigo); color: #fff; font-weight: 600; font-size: .95rem;
          text-decoration: none; }
  .back:hover { filter: brightness(1.08); }
  .back:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  {{template "mark" 44}}
  <h1>This download link has expired</h1>
  <p class="note">A download link from HyperDrop works once, for a few minutes. Go back to HyperDrop and download the file again.</p>
  <a class="back" href="{{.AppURL}}">Back to HyperDrop</a>
</main>
</body>
</html>
