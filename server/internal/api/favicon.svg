<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="HyperDrop">
  <!-- The tab mark: website/icon.svg's glyph in black on a white square, and in
       white on a black square when the browser is in dark mode. The colours are
       attributes so the light version still draws where a Content-Security-Policy
       drops the style element. The site, the names registry and every HyperDrop
       server serve these bytes (the registry and the server at /icon.svg);
       favicon.ico is this drawing's light version (make-icons.sh). -->
  <style>@media (prefers-color-scheme: dark) { rect { fill: #000 } path { fill: #fff } }</style>
